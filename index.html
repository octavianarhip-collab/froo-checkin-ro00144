<!doctype html>
<html lang="ro">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>FROO RO00144 - Operator</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:Arial,Helvetica,sans-serif;background:#f5f7f6;color:#1f2937}.wrap{min-height:100vh;display:grid;place-items:center;padding:20px}.card{width:min(560px,100%);background:#fff;border-radius:18px;padding:26px;box-shadow:0 10px 30px rgba(0,0,0,.08)}h1{margin:0 0 8px;font-size:26px}.sub{margin:0 0 20px;color:#5f6b76;line-height:1.45}label{display:block;font-weight:700;margin-bottom:8px}select,button{width:100%;min-height:54px;border-radius:12px;font-size:17px}select{border:1px solid #cbd5e1;padding:0 14px;background:#fff}button{margin-top:14px;border:0;font-weight:700;cursor:pointer;padding:0 14px}.primary{background:#188038;color:#fff}.secondary{background:#eef7f0;color:#137333;border:1px solid #b7dfc2}.remembered{display:none;margin:0 0 18px;padding:12px 14px;border-radius:12px;background:#eef7f0;color:#137333;line-height:1.4}.remembered button{width:auto;min-height:0;margin:8px 0 0;padding:0;background:transparent;color:#5f6b76;font-size:13px;font-weight:400;text-decoration:underline}#status{margin-top:18px;line-height:1.45;min-height:22px}.note{margin-top:20px;font-size:13px;color:#6b7280;line-height:1.45}.ok{color:#137333;font-weight:700}.bad{color:#b3261e;font-weight:700}.tasks{display:none;margin-top:22px}.tasks h2{font-size:20px;margin:0 0 6px}.shiftTitle{color:#5f6b76;margin:0 0 14px}.task{border:1px solid #d8e0dc;border-radius:14px;padding:14px;margin:10px 0;background:#fff}.taskTop{display:flex;gap:10px;justify-content:space-between;align-items:flex-start}.taskName{font-weight:700;line-height:1.35}.time{white-space:nowrap;font-weight:700;color:#137333}.task small{display:block;color:#6b7280;margin-top:5px}.task button{min-height:44px;font-size:15px;margin-top:10px}.shared{display:inline-block;font-size:11px;background:#eef7f0;color:#137333;padding:3px 7px;border-radius:999px;margin-top:6px}.divider{height:1px;background:#e5e7eb;margin:22px 0 4px}
</style>
</head>
<body>
<main class="wrap"><section class="card">
<h1 id="pageTitle">FROO RO00144</h1>
<p id="pageSub" class="sub">Selectează Operatorul și continuă.</p>
<div id="rememberedBox" class="remembered"><strong id="rememberedText"></strong><br><button id="changeOperatorBtn" type="button">Schimbă Operatorul</button></div>
<div id="operatorBlock"><label for="operator">Operator</label><select id="operator"><option value="">Selectează operatorul</option><option value="Madalina">Mădălina</option><option value="Anca">Anca</option><option value="Operator tura scurta">Operator tură scurtă</option></select></div>
<button id="continueBtn" class="primary" type="button">Continuă</button>
<div id="status" role="status" aria-live="polite"></div>
<div id="tasks" class="tasks">
  <div class="divider"></div>
  <h2>Taskurile tale de azi</h2>
  <p id="shiftTitle" class="shiftTitle"></p>
  <div id="taskList"></div>
</div>
<p id="pageNote" class="note">Operatorul este memorat pe acest dispozitiv doar pentru ziua curentă. După check-in, sunt afișate numai taskurile atribuite turei selectate, plus taskurile comune ambelor ture.</p>
</section></main>
<script>
const STORE_LAT=44.47831860912019;
const STORE_LNG=26.04044731207135;
const RADIUS_M=100;
const FORM_BASE_URL='https://docs.google.com/forms/d/e/1FAIpQLScX8oh0uhfPRBiNvSzKuPzLphcNtUnmcVA-0SOV5n06bFQ6cQ/viewform';
const SCRIPT_URL='https://script.google.com/macros/s/AKfycbyl6sJYPPnq03K-SWNPrd5RI2ppbFfk94QWOmtMD0GyUbv0P3WNkvxdyVs_sdG-Dd0IAQ/exec';
const DASHBOARD_URL='https://docs.google.com/spreadsheets/d/1IJ5E2LB4VQQUOmTxe4oyUU6qXGwHcsNRrFp_zNSNowk/edit#gid=1433658858';
const STORAGE_KEY='froo_ro00144_operator_day';
const TASK_ENTRY_ID='entry.1604491701';

const TASKS=[
{id:'T002',time:'07:10',name:'Echipament complet + spălat mâini',shift:'both'},
{id:'T003',time:'07:10',name:'Pornire și verificare roller / grill / MerryChef / bain-marie',shift:'short'},
{id:'T004',time:'07:10',name:'Verificare vitrine frigorifice, frigidere și congelatoare',shift:'short'},
{id:'T005',time:'07:10',name:'Verificare aparat cafea și consumabile',shift:'long'},
{id:'T006',time:'07:10',name:'Deschidere și verificare POS / casă de marcat',shift:'both'},
{id:'T007',time:'07:15',name:'Pregătire și coacere patiserie conform planului',shift:'long'},
{id:'T022',time:'07:15',name:'Verificare consumabile Bistro și Bake-Off; completare necesar',shift:'short'},
{id:'T019',time:'07:20',name:'Igienizare ustensile, cuve, clești, tăvi și suprafețe de lucru',shift:'short'},
{id:'T008',time:'07:45',name:'Raft Bake-Off/patiserie complet si prezentabil',shift:'long'},
{id:'T009',time:'07:50',name:'Aprovizionare și FIFO vitrine QMS / Fresh',shift:'long'},
{id:'T010',time:'07:50',name:'Verificare stoc cârnați/chifle și alimentare roller/bain-marie',shift:'short'},
{id:'T017',time:'07:50',name:'Etichetare produse Bake-Off cu data de producție / termen de vânzare',shift:'long'},
{id:'T014',time:'08:15',name:'Vitrina Fresh (brânzeturi/mezeluri) aprovizionată și aranjată conform FIFO',shift:'short'},
{id:'T011',time:'08:30',name:'Verificare etichete preț și promoții',shift:'long'},
{id:'T024',time:'08:30',name:'Raportare manager: probleme tehnice, lipsă marfă sau stoc mic',shift:'long'},
{id:'T013',time:'08:45',name:'Aprovizionare vitrine bauturi reci',shift:'short'},
{id:'T018',time:'09:00',name:'Completare fișe trasabilitate și lotizare pentru Bistro / lapte',shift:'long'},
{id:'T025',time:'09:00',name:'Capăt de raft promoțional verificat și complet conform campaniei',shift:'long'},
{id:'T021',time:'10:15',name:'Verificare planograme și disponibilitate produse la raft',shift:'short'},
{id:'T023',time:'14:00',name:'Retragere deșeuri și depozitare în zona special amenajată',shift:'short'},
{id:'T012',time:'15:00',name:'Verificare FIFO / FEFO și produse neconforme',shift:'short'},
{id:'T015',time:'16:00',name:'Recepție marfă și verificare cantitate/calitate',shift:'long'},
{id:'T020',time:'20:00',name:'Verificare termene de valabilitate și retragere produse neconforme / expirate',shift:'long'},
{id:'T027',time:'21:00',name:'Curățare aparat cafea – ciclu automat de seară',shift:'long'},
{id:'T016',time:'21:45',name:'Curățenie sală, Bistro, Bake-Off și golire coșuri',shift:'long'}
];

const continueBtn=document.getElementById('continueBtn'),operatorSelect=document.getElementById('operator'),operatorBlock=document.getElementById('operatorBlock'),rememberedBox=document.getElementById('rememberedBox'),rememberedText=document.getElementById('rememberedText'),changeOperatorBtn=document.getElementById('changeOperatorBtn'),status=document.getElementById('status'),tasksBox=document.getElementById('tasks'),taskList=document.getElementById('taskList'),shiftTitle=document.getElementById('shiftTitle'),pageTitle=document.getElementById('pageTitle'),pageSub=document.getElementById('pageSub'),pageNote=document.getElementById('pageNote');
function todayKey(){const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}
function displayOperator(o){if(o==='Madalina')return'Mădălina';if(o==='Operator tura scurta')return'Operator tură scurtă';return o}
function getRememberedOperator(){try{const raw=localStorage.getItem(STORAGE_KEY);if(!raw)return'';const data=JSON.parse(raw);if(!data||data.date!==todayKey()||!data.operator){localStorage.removeItem(STORAGE_KEY);return''}return data.operator}catch(e){return''}}
function rememberOperator(o){try{localStorage.setItem(STORAGE_KEY,JSON.stringify({date:todayKey(),operator:o}))}catch(e){}applyRememberedState(o)}
function clearRememberedOperator(){try{localStorage.removeItem(STORAGE_KEY)}catch(e){}operatorSelect.value='';rememberedBox.style.display='none';operatorBlock.style.display='block';tasksBox.style.display='none';status.textContent=''}
function applyRememberedState(o){operatorSelect.value=o;rememberedText.textContent='Operator memorat azi: '+displayOperator(o);rememberedBox.style.display='block';operatorBlock.style.display='none'}
function getShift(o){if(o==='Madalina'||o==='Anca')return'Tura lunga 07:00-22:00';if(o==='Operator tura scurta')return'Tura scurta 07:00-16:00';return''}
function shiftKey(o){return(o==='Madalina'||o==='Anca')?'long':'short'}
function buildFormUrl(o,a,taskName=''){const p=new URLSearchParams();p.set('usp','pp_url');p.set('entry.1368133778',o);p.set('entry.16512039',getShift(o));p.set('entry.455388205',a);if(taskName)p.set(TASK_ENTRY_ID,taskName);return FORM_BASE_URL+'?'+p.toString()}
function distanceMeters(a,b,c,d){const R=6371000,r=v=>v*Math.PI/180,x=r(c-a),y=r(d-b),q=Math.sin(x/2)**2+Math.cos(r(a))*Math.cos(r(c))*Math.sin(y/2)**2;return R*2*Math.atan2(Math.sqrt(q),Math.sqrt(1-q))}
async function saveLocation(payload){const body=new URLSearchParams();Object.entries(payload).forEach(([k,v])=>body.append(k,String(v)));await fetch(SCRIPT_URL,{method:'POST',mode:'no-cors',body})}
function requireOperator(){const o=operatorSelect.value||getRememberedOperator();if(!o){status.innerHTML='<span class="bad">Selectează Operatorul.</span>';return null}return o}
function setBusy(v){continueBtn.disabled=v}
function showGeoError(e){setBusy(false);if(e.code===1)status.innerHTML='<span class="bad">Accesul la locație a fost refuzat. Permite locația în browser și încearcă din nou.</span>';else if(e.code===2)status.innerHTML='<span class="bad">Locația nu a putut fi determinată.</span>';else status.innerHTML='<span class="bad">Localizarea a durat prea mult. Încearcă din nou.</span>'}
function checkServerCheckin(operator){return new Promise((resolve,reject)=>{const cb='frooStatus_'+Date.now()+'_'+Math.floor(Math.random()*100000);const s=document.createElement('script');const timer=setTimeout(()=>{cleanup();reject(new Error('timeout'))},10000);function cleanup(){clearTimeout(timer);delete window[cb];s.remove()}window[cb]=data=>{cleanup();resolve(!!(data&&data.ok&&data.checkedIn))};s.onerror=()=>{cleanup();reject(new Error('network'))};s.src=SCRIPT_URL+'?mode=status&operator='+encodeURIComponent(operator)+'&callback='+encodeURIComponent(cb)+'&_='+Date.now();document.body.appendChild(s)})}
async function doInitialCheckin(operator){if(!navigator.geolocation){status.innerHTML='<span class="bad">Acest browser nu permite accesul la locație.</span>';setBusy(false);return}status.textContent='Se pregătește începutul turei...';navigator.geolocation.getCurrentPosition(async pos=>{const lat=pos.coords.latitude,lng=pos.coords.longitude,accuracy=Math.round(pos.coords.accuracy||0),distance=Math.round(distanceMeters(lat,lng,STORE_LAT,STORE_LNG)),inStoreArea=distance<=RADIUS_M?'DA':'NU';try{await saveLocation({operator,latitude:lat,longitude:lng,accuracy,distance,inStoreArea});status.innerHTML='<span class="ok">Locația a fost înregistrată.</span> Se deschide check-in-ul...';setTimeout(()=>window.location.assign(buildFormUrl(operator,'Check-in tura')),500)}catch(e){setBusy(false);status.innerHTML='<span class="bad">Înregistrarea nu a putut fi salvată. Încearcă din nou.</span>'}},showGeoError,{enableHighAccuracy:true,timeout:30000,maximumAge:15000})}
function showTasks(operator){const sk=shiftKey(operator);const items=TASKS.filter(t=>t.shift===sk||t.shift==='both').sort((a,b)=>a.time.localeCompare(b.time));shiftTitle.textContent=(sk==='long'?'Tură lungă 07:00–22:00':'Tură scurtă 07:00–16:00')+' • '+items.length+' taskuri alocate';taskList.innerHTML='';items.forEach(t=>{const d=document.createElement('div');d.className='task';d.innerHTML='<div class="taskTop"><div class="taskName">'+t.name+'</div><div class="time">'+t.time+'</div></div><small>'+t.id+'</small>'+(t.shift==='both'?'<span class="shared">Ambele ture</span>':'')+'<button type="button" class="secondary">Deschide acest task</button>';d.querySelector('button').addEventListener('click',()=>window.location.assign(buildFormUrl(operator,'Executare task',t.name)));taskList.appendChild(d)});tasksBox.style.display='block';tasksBox.scrollIntoView({behavior:'smooth',block:'start'})}
function isManagerAlertMode(){const p=new URLSearchParams(window.location.search);return (p.get('manager')||'').toLowerCase()==='elena'&&(p.get('source')||'').toLowerCase()==='alerta'}
function goDashboard(){window.location.assign(DASHBOARD_URL)}
function managerAlertLocation(){operatorBlock.style.display='none';rememberedBox.style.display='none';tasksBox.style.display='none';pageTitle.textContent='FROO RO00144 — Manager';pageSub.textContent='Se înregistrează locația pentru accesul din alerta operațională.';pageNote.textContent='Locația este folosită doar pentru această accesare. Istoricul locațiilor nu este afișat în Dashboard.';continueBtn.textContent='Continuă către Dashboard';continueBtn.onclick=goDashboard;if(!navigator.geolocation){status.innerHTML='<span class="bad">Locația nu este disponibilă pe acest dispozitiv.</span> Se deschide Dashboard-ul...';setTimeout(goDashboard,1200);return}setBusy(true);status.textContent='Se solicită locația...';navigator.geolocation.getCurrentPosition(async pos=>{const lat=pos.coords.latitude,lng=pos.coords.longitude,accuracy=Math.round(pos.coords.accuracy||0),distance=Math.round(distanceMeters(lat,lng,STORE_LAT,STORE_LNG)),inStoreArea=distance<=RADIUS_M?'DA':'NU';try{await saveLocation({operator:'Elena',latitude:lat,longitude:lng,accuracy,distance,inStoreArea,source:'alerta_manager'});status.innerHTML='<span class="ok">Locația a fost înregistrată.</span> Se deschide Dashboard-ul...'}catch(e){status.innerHTML='<span class="bad">Locația nu a putut fi salvată.</span> Se deschide Dashboard-ul...'}setTimeout(goDashboard,700)},e=>{setBusy(false);if(e.code===1)status.innerHTML='<span class="bad">Accesul la locație nu a fost permis.</span> Apasă butonul pentru Dashboard.';else status.innerHTML='<span class="bad">Locația nu a putut fi determinată.</span> Apasă butonul pentru Dashboard.'},{enableHighAccuracy:true,timeout:30000,maximumAge:15000})}
changeOperatorBtn.addEventListener('click',clearRememberedOperator);
continueBtn.addEventListener('click',async()=>{if(isManagerAlertMode())return;const operator=requireOperator();if(!operator)return;rememberOperator(operator);setBusy(true);status.textContent='Se verifică statusul turei...';try{const checkedIn=await checkServerCheckin(operator);if(checkedIn){status.innerHTML='<span class="ok">Check-in găsit.</span> Mai jos sunt doar taskurile acestei ture.';showTasks(operator);setBusy(false)}else{await doInitialCheckin(operator)}}catch(e){setBusy(false);status.innerHTML='<span class="bad">Nu am putut verifica check-in-ul. Încearcă din nou.</span>'}});
if(isManagerAlertMode()){managerAlertLocation()}else{const remembered=getRememberedOperator();if(remembered)applyRememberedState(remembered)}
</script>
</body>
</html>
